# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=recover:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=profile:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=submit:10m rate=10r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name wiesenwahn.de;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wiesenwahn.de;

    # SSL — managed by Certbot (paths updated after cert creation)
    ssl_certificate /etc/letsencrypt/live/wiesenwahn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiesenwahn.de/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # CSP: scripts only from our own origin. 'unsafe-inline' for styles is required by MUI/Emotion,
    # which injects <style> tags at runtime. Google Fonts until the fonts are self-hosted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide nginx version
    server_tokens off;

    # Max upload size (for signatures etc.)
    client_max_body_size 5M;

    # Proxy headers for all locations below. This is the edge proxy, so X-Forwarded-For is
    # overwritten (not appended): client-supplied values must never reach the backend.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # API — rate limited
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/;
    }

    # Auth endpoints — stricter rate limit
    location = /api/auth {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/auth;
    }

    location = /api/auth/admin {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/auth/admin;
    }

    location = /api/auth/artist {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/auth/artist;
    }

    # Profile area: the UUID in the URL is the only secret, so limit request rates.
    # The profile page fires several requests at once, hence the burst.
    location /api/profile/ {
        limit_req zone=profile burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/profile/;
    }

    # Booking submissions
    location = /api/submitForm {
        limit_req zone=submit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/submitForm;
    }

    location = /api/artist/submitForm {
        limit_req zone=submit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/artist/submitForm;
    }

    location = /api/profile/recover {
        limit_req zone=recover burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5001/api/profile/recover;
    }

    # Block common scan paths, but keep the real SPA admin route reachable.
    location ~* ^/(wp-admin|wp-login|phpmyadmin|adminer|\.env|\.git) {
        return 444;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
