[project]
name = "event-booking-system"
version = "1.0.0"
description = "Event booking system for music festival"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.0",
    "py-ts-interfaces>=0.5.0",
    "flask-praetorian>=1.6.0",
    "Flask-Limiter>=4.1.0",
    "Flask-JWT-Extended>=4.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "requests>=2.33.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.10",  # keep in sync with .pre-commit-config.yaml
    "mypy==1.19.1",  # keep in sync with .pre-commit-config.yaml
    "pre-commit>=4.0.0",
    "import-linter==2.17",  # keep in sync with .pre-commit-config.yaml
    "pytest-cov>=6.0.0",
    "types-requests>=2.32.0",
    "types-Flask>=1.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# RUFF - Fast Python Linter (replaces Flake8, isort, pyupgrade)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "test"]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # flake8-datetimez
    "DTZ",
    # flake8-print
    "T20",
    # flake8-pytest-style
    "PT",
    # flake8-unused-arguments
    "ARG",
    # flake8-use-pathlib
    "PTH",
    # Pylint
    "PL",
    # flake8-bandit (security)
    "S",
    # Performance
    "PERF",
    # McCabe complexity (max-complexity below is only enforced with C90 selected)
    "C90",
    # flake8-tidy-imports (banned APIs, relative imports)
    "TID",
]

ignore = [
    "E501",     # line-too-long (handled by formatter)
    "S101",     # assert (used in tests)
    "PLR2004",  # magic values (common in config)
    "T201",     # print (allow for now, can be stricter later)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports
"src/migrations/*.py" = ["ALL"]    # Legacy one-off migrations, replaced in B2
"test/*.py" = ["S101", "ARG", "PLR2004"]  # Allow asserts and magic values in tests
"src/scripts/generate_mock_data.py" = ["S311"]  # Mock data does not need cryptographic randomness

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # Allow some wiggle room

# File length (max. 300 code lines) is enforced by tools/check_file_length.py.
#
# Lint baseline: violations that existed when the rules were tightened (2026-11-18)
# are suppressed inline with "# noqa: <CODE>  # lint-baseline". These must be
# removed step by step; never add new "lint-baseline" comments.

# ============================================================================
# MYPY - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================================
# PYTEST - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]

# ============================================================================
# COVERAGE - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================================================
# IMPORT-LINTER - Architecture contracts (run: lint-imports)
# ============================================================================
# Layering: api -> services -> models -> utils. src/scripts and src/migrations are
# standalone scripts (no packages) and are not covered.
# ignore_imports entries below are pre-existing violations (2026-11-18) that must be
# removed step by step (see docs/REFACTORING_PLAN.md). Do not add new ones.
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "src.api",
    "src.services",
    "src.models",
    "src.utils",
]

[[tool.importlinter.contracts]]
name = "Services are independent of the web framework"
type = "forbidden"
source_modules = ["src.services", "src.models"]
forbidden_modules = ["flask", "flask_jwt_extended", "flask_limiter", "flask_cors"]
# Only direct imports: src.utils.logger is infrastructure and may use the request context.
allow_indirect_imports = true
ignore_imports = [
    "src.services.app_settings_service -> flask",
]
