[project]
name = "event-booking-system"
version = "1.0.0"
description = "Event booking system for music festival"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.0",
    "Flask-Cors>=6.0.0",
    "py-ts-interfaces>=0.5.0",
    "flask-praetorian>=1.6.0",
    "Flask-Limiter>=4.1.0",
    "Flask-JWT-Extended>=4.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "requests>=2.32.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest-cov>=6.0.0",
    "types-requests>=2.32.0",
    "types-Flask>=1.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# RUFF - Fast Python Linter (replaces Flake8, isort, pyupgrade)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "test"]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # flake8-datetimez
    "DTZ",
    # flake8-print
    "T20",
    # flake8-pytest-style
    "PT",
    # flake8-unused-arguments
    "ARG",
    # flake8-use-pathlib
    "PTH",
    # Pylint
    "PL",
    # flake8-bandit (security)
    "S",
    # Performance
    "PERF",
]

ignore = [
    "E501",     # line-too-long (handled by formatter)
    "S101",     # assert (used in tests)
    "S608",     # SQL injection (we use parameterized queries)
    "PLR2004",  # magic values (common in config)
    "T201",     # print (allow for now, can be stricter later)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports
"migrations/*.py" = ["ALL"]        # Ignore migrations
"test/*.py" = ["S101", "ARG", "PLR2004"]  # Allow asserts and magic values in tests

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # Allow some wiggle room

# File length enforcement (custom via Ruff's upcoming features)
# For now, we'll enforce this manually

# ============================================================================
# BLACK - Code Formatter
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py312']
skip-string-normalization = false
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# ============================================================================
# MYPY - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================================
# PYTEST - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]

# ============================================================================
# COVERAGE - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]