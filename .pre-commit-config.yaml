# Pre-commit hooks for code quality
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Frontend hooks use the tool versions from frontend/package.json (run `npm install` first).

repos:
  # Python - Ruff (linting, import sorting and formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(server|tools)/
      - id: ruff-format
        files: ^(server|tools)/

  # Python - mypy (type checking)
  # Manual stage until the existing errors are fixed: pre-commit run mypy --hook-stage manual
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        stages: [manual]
        files: ^server/
        args: [--config-file=server/pyproject.toml]
        additional_dependencies:
          - types-requests
          - types-Flask

  - repo: local
    hooks:
      # Python - architecture contracts (see [tool.importlinter] in server/pyproject.toml)
      - id: import-linter
        name: import-linter
        language: python
        additional_dependencies: [import-linter==2.17]
        entry: bash -c 'cd server && lint-imports'
        files: ^server/src/.*\.py$
        pass_filenames: false

      # Max. code lines per file (see tools/check_file_length.py)
      - id: file-length
        name: file length
        language: system
        entry: python3 tools/check_file_length.py
        files: \.(py|tsx?)$|^tools/file_length_allowlist\.txt$
        pass_filenames: false

      # TypeScript - ESLint and Prettier from frontend/node_modules
      - id: eslint
        name: eslint
        language: system
        entry: frontend/node_modules/.bin/eslint --fix --max-warnings=0
        files: ^frontend/src/.*\.[jt]sx?$

      - id: prettier
        name: prettier
        language: system
        entry: frontend/node_modules/.bin/prettier --write
        files: ^frontend/src/.*\.(ts|tsx|json|css|scss|md)$

  # General - trailing whitespace, end of file, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.txt)$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Security - detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json
