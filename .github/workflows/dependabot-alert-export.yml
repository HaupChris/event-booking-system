name: Export Dependabot Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: read

jobs:
  export-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export open Dependabot alerts to CSV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          owner = os.environ["REPO_OWNER"]
          repo = os.environ["REPO_NAME"]

          base_url = f"https://api.github.com/repos/{owner}/{repo}/dependabot/alerts"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dependabot-alert-export-workflow",
          }

          rows = []
          page = 1

          while True:
              params = {
                  "state": "open",
                  "per_page": "100",
                  "page": str(page),
              }
              url = f"{base_url}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(req) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"GitHub API returned {response.status} while fetching page {page}"
                          )
                      alerts = json.load(response)
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API request failed with {error.code} on page {page}: {details}"
                  ) from error

              if not alerts:
                  break

              for alert in alerts:
                  dependency = alert.get("dependency") or {}
                  dependency_package = dependency.get("package") or {}
                  advisory = alert.get("security_advisory") or {}
                  vulnerability = alert.get("security_vulnerability") or {}
                  vulnerability_package = vulnerability.get("package") or {}
                  first_patched_version = vulnerability.get("first_patched_version") or {}

                  rows.append(
                      {
                          "alert_number": alert.get("number"),
                          "state": alert.get("state"),
                          "severity": vulnerability.get("severity") or advisory.get("severity"),
                          "scope": dependency.get("scope"),
                          "relationship": dependency.get("relationship"),
                          "ecosystem": dependency_package.get("ecosystem")
                          or vulnerability_package.get("ecosystem"),
                          "package_name": dependency_package.get("name")
                          or vulnerability_package.get("name"),
                          "manifest_path": dependency.get("manifest_path"),
                          "ghsa_id": advisory.get("ghsa_id"),
                          "cve_id": advisory.get("cve_id"),
                          "summary": advisory.get("summary"),
                          "vulnerable_version_range": vulnerability.get("vulnerable_version_range"),
                          "first_patched_version": first_patched_version.get("identifier"),
                          "created_at": alert.get("created_at"),
                          "updated_at": alert.get("updated_at"),
                          "html_url": alert.get("html_url"),
                      }
                  )

              page += 1

          os.makedirs("data", exist_ok=True)

          fieldnames = [
              "alert_number",
              "state",
              "severity",
              "scope",
              "relationship",
              "ecosystem",
              "package_name",
              "manifest_path",
              "ghsa_id",
              "cve_id",
              "summary",
              "vulnerable_version_range",
              "first_patched_version",
              "created_at",
              "updated_at",
              "html_url",
          ]

          with open("data/vulnerability.csv", "w", newline="", encoding="utf-8") as csv_file:
              writer = csv.DictWriter(csv_file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Exported {len(rows)} open Dependabot alerts to data/vulnerability.csv")
          PY

      - name: Upload vulnerability report artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability_report
          path: data/vulnerability.csv
