name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        run: echo "REPO_OWNER_LOWERCASE=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/wiesenwahn-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/wiesenwahn-frontend:latest

      - name: Prepare docker-compose.yml with environment variables
        run: |
          sed -i 's/${REPO_OWNER}/${{ env.REPO_OWNER_LOWERCASE }}/g' docker-compose.yml

      - name: Read nginx config
        id: nginx_config
        run: |
          {
            echo 'content<<__NGINX_CONF__'
            cat deployment/nginx/wiesenwahn.conf
            echo '__NGINX_CONF__'
          } >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/wiesenwahn/"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/wiesenwahn/data
            mkdir -p /opt/wiesenwahn/logs

            cat > /tmp/wiesenwahn.conf.new <<'EOF'
            ${{ steps.nginx_config.outputs.content }}
            EOF

            if ! cmp -s /tmp/wiesenwahn.conf.new /etc/nginx/sites-available/wiesenwahn.conf; then
              cp /etc/nginx/sites-available/wiesenwahn.conf /etc/nginx/sites-available/wiesenwahn.conf.bak-$(date +%F-%H%M%S) || true
              install -D -m 644 /tmp/wiesenwahn.conf.new /etc/nginx/sites-available/wiesenwahn.conf
              ln -sf /etc/nginx/sites-available/wiesenwahn.conf /etc/nginx/sites-enabled/wiesenwahn.conf
              nginx -t
              systemctl reload nginx
            fi

            # Create .env file with secrets
            cat > /opt/wiesenwahn/.env << EOL
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            USER_PASSWORD=${{ secrets.USER_PASSWORD }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ARTIST_PASSWORD=${{ secrets.ARTIST_PASSWORD }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_PASS=${{ secrets.GMAIL_PASS }}
            EOL
            chmod 600 /opt/wiesenwahn/.env

            # Backup database before updating
            bash /opt/wiesenwahn/backup.sh deploy-backup || true

            # Pull latest images and restart services sequentially (RAM-friendly)
            cd /opt/wiesenwahn
            docker compose pull backend
            docker compose up -d --no-deps --force-recreate backend
            docker compose pull frontend
            docker compose up -d --no-deps --force-recreate frontend

            # Clean up stale images older than 7 days
            docker image prune -af --filter "until=168h"
