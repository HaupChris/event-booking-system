name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by deploy.yml, which calls this workflow
  workflow_call:
  schedule:
    - cron: "0 5 * * 1" # weekly: catch new CVEs in unchanged dependencies

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Architecture contracts
        run: uv run --no-sync lint-imports

      - name: File length
        working-directory: .
        run: python tools/check_file_length.py

      # Not blocking until the existing type errors are fixed (see docs/REFACTORING_PLAN.md).
      - name: mypy (non-blocking)
        continue-on-error: true
        run: uv run --no-sync mypy .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run --no-sync pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint, format and type check
        run: npm run quality

      - name: Tests
        run: npm test

  # Trivy runs from its official image, pinned by digest (no third-party action needed).
  security-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies, Dockerfiles and secrets
        run: >
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" fs
          --scanners vuln,misconfig,secret
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --ignorefile /repo/.trivyignore
          /repo

  image-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: |
          docker build --pull -t wiesenwahn-backend:scan server
          docker build --pull -t wiesenwahn-frontend:scan frontend

      - name: Scan images
        run: |
          for image in wiesenwahn-backend:scan wiesenwahn-frontend:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image"
          done
