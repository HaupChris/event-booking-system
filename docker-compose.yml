services:
  backend:
    image: ghcr.io/${REPO_OWNER}/wiesenwahn-backend:latest
    restart: always
    command:
      [
        "gunicorn",
        "-b",
        "0.0.0.0:5001",
        "--workers",
        "1",
        "--threads",
        "2",
        "--timeout",
        "90",
        "--max-requests",
        "500",
        "--max-requests-jitter",
        "50",
        "main:app",
      ]
    ports:
      - "127.0.0.1:5001:5001"   # bind container’s 5001 → host’s 127.0.0.1:5001
    volumes:
      - ./data:/app/user_data:rw
      - ./logs:/app/logs:rw
    environment:
      - IN_DOCKER=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PASSWORD=${USER_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ARTIST_PASSWORD=${ARTIST_PASSWORD}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 384m
  frontend:
    image: ghcr.io/${REPO_OWNER}/wiesenwahn-frontend:latest
    restart: always
    ports:
      - "127.0.0.1:8080:80"  # Only accessible via host nginx reverse proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    mem_limit: 128m
    depends_on:
      - backend
